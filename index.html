<!DOCTYPE html>
<html lang="en" data-theme="dark" data-wallpaper="aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoOS</title>
  <meta name="description" content="A personal desktop in the browser — notes, settings and your own account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Cpath d='M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <!-- Boot splash -->
  <div class="boot" id="boot">
    <div class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z" fill="#fff"/></svg>
    </div>
    <p class="boot-label">Starting RepoOS</p>
  </div>

  <!-- Sign in / create account -->
  <main class="auth" id="auth" hidden>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z" fill="#fff"/></svg>
        </span>
        <div>
          <h1 id="auth-title">RepoOS</h1>
          <p class="brand-sub">Your desktop. Your data. Your account.</p>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Account action">
        <button class="tab is-active" id="tab-signin" role="tab" aria-selected="true" type="button">Sign in</button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false" type="button">Create account</button>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="field" id="name-field" hidden>
          <span>Display name</span>
          <input id="auth-name" type="text" autocomplete="name" maxlength="40" placeholder="Alex">
        </label>
        <label class="field">
          <span>Email</span>
          <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" required placeholder="At least 8 characters">
        </label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn primary" id="auth-submit" type="submit">Sign in</button>
      </form>

      <p class="auth-foot">Accounts and notes are stored on this app's own server — no third-party sign-in.</p>
    </section>
  </main>

  <!-- Desktop -->
  <main class="desktop" id="desktop" hidden>
    <div class="desktop-icons" id="desktop-icons"></div>
    <div class="windows" id="windows"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <nav class="taskbar" aria-label="Taskbar">
      <button class="start-btn" id="start-btn" type="button" aria-expanded="false" aria-controls="start-menu" title="Start">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 9h6v6H9zM17 9h6v6h-6zM9 17h6v6H9zM17 17h6v6h-6z" fill="#fff"/></svg>
      </button>
      <div class="taskbar-apps" id="taskbar-apps"></div>
      <div class="tray">
        <button class="tray-clock" id="tray-clock" type="button" title="Date and time">
          <span id="clock-time">--:--</span>
          <span id="clock-date"></span>
        </button>
        <button class="avatar" id="avatar" type="button" title="Account"></button>
      </div>
    </nav>

    <div class="start-menu" id="start-menu" hidden>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input id="start-search" type="search" placeholder="Search apps" autocomplete="off">
      </label>
      <p class="start-label">Pinned</p>
      <div class="start-grid" id="start-grid"></div>
      <footer class="start-foot">
        <span class="start-user" id="start-user"></span>
        <button class="btn ghost small" id="sign-out" type="button">Sign out</button>
      </footer>
    </div>

    <div class="account-menu" id="account-menu" hidden>
      <div class="account-head">
        <span class="avatar large" id="account-avatar"></span>
        <div>
          <strong id="account-name"></strong>
          <span id="account-email"></span>
        </div>
      </div>
      <button class="menu-item" id="account-settings" type="button">Account settings</button>
      <button class="menu-item danger" id="account-signout" type="button">Sign out</button>
    </div>
  </main>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
